# ---------- CCEMS configuration ----------
server.port=${PORT:8080}
server.shutdown=graceful

# MySQL (default). Override with environment variables if needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ccems?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
ccems.jwt.secret=${JWT_SECRET:ccems-super-secret-signing-key-change-me-in-production-0123456789}
ccems.jwt.expiration-ms=86400000

# CORS (React dev server). In production the frontend and API share one origin, so this is rarely needed.
ccems.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Uploaded files (event resources and submissions)
ccems.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Demo data on first run. Set SEED_DEMO_DATA=false for a clean database.
ccems.seed.enabled=${SEED_DEMO_DATA:true}

# First admin for a clean database (used only when there are no users yet)
ccems.bootstrap.admin-email=${ADMIN_EMAIL:}
ccems.bootstrap.admin-password=${ADMIN_PASSWORD:}
ccems.bootstrap.admin-name=${ADMIN_NAME:Administrator}

# Health check for Docker and load balancers
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
