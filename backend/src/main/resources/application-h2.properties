# Run with:  mvn spring-boot:run "-Dspring-boot.run.profiles=h2"
# In-memory database, no MySQL needed. Data resets on every restart.
spring.datasource.url=jdbc:h2:mem:ccems;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
